name: Build Android TV test APK

on:
  push:
    branches:
      - fix/android-tv-dpad-focus
    paths:
      - '.github/workflows/build-test-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/android-tv-dpad-focus

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -x lint

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CCloud-Android-TV-test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
